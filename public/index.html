<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#02070f" />
  <title>VEGA — BTC · LTC · USDT Exchange</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="hdr">
      <div class="hdr-star">✦</div>
      <div class="hdr-logo">VEGA</div>
      <div class="hdr-sub">OFFICIAL · BTC · LTC · USDT EXCHANGE</div>
      <div class="hdr-status" id="hdrStatus"></div>
    </header>

    <div class="announce" id="announce"></div>

    <div class="announce hidden" id="syncStatus" role="status" aria-live="polite"></div>

    <main id="main">
      <section id="view-exchange" class="view"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-refs" class="view hidden"></section>
      <section id="view-support" class="view hidden"></section>
      <section id="view-info" class="view hidden"></section>
    </main>

    <nav class="nav" id="nav"></nav>
  </div>

  <div id="assetSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetTitle">
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title" id="sheetTitle">Криптовалюта</div>
        <button class="sheet-close" id="sheetClose" aria-label="Закрыть">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-list" id="sheetList" role="listbox"></div>
      <div class="sheet-foot hidden" id="sheetFoot"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
