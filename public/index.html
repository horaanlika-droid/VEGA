<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#02070f" />
  <title>VEGA — BTC &amp; LTC Exchange</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="hdr">
      <div class="hdr-star">✦</div>
      <div class="hdr-logo">VEGA</div>
      <div class="hdr-sub">OFFICIAL · BTC &amp; LTC EXCHANGE</div>
      <div class="hdr-status" id="hdrStatus"></div>
    </header>

    <div class="announce" id="announce"></div>

    <main id="main">
      <section id="view-exchange" class="view"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-refs" class="view hidden"></section>
      <section id="view-info" class="view hidden"></section>
    </main>

    <nav class="nav" id="nav"></nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
